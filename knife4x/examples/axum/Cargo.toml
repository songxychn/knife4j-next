[package]
name = "knife4x-axum-example"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
knife4x = { path = "../../rust", features = ["axum"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
utoipa = "6"
utoipa-axum = "0.3"

[dev-dependencies]
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
