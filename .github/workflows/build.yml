name: Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      java: ${{ steps.classify.outputs.java }}
      react: ${{ steps.classify.outputs.react }}
      vue3: ${{ steps.classify.outputs.vue3 }}
      docs: ${{ steps.classify.outputs.docs }}
      knife4x_go: ${{ steps.classify.outputs.knife4x_go }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Verify current-entry docs version
        run: tools/verify-current-version-docs.py

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          changed_paths="$(mktemp)"
          trap 'rm -f "$changed_paths"' EXIT
          if ! tools/ci-changed-paths.sh "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA" > "$changed_paths"; then
            tools/ci-changes.sh </dev/null >> "$GITHUB_OUTPUT"
          else
            tools/ci-changes.sh < "$changed_paths" >> "$GITHUB_OUTPUT"
          fi

  java-build-test:
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify release module list
        run: tools/verify-release-modules.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Verify Java modules
        run: tools/test-java.sh

      - name: Smoke-tests evidence summary
        if: always()
        run: ./tools/smoke-evidence.sh --summary >> "$GITHUB_STEP_SUMMARY"

      - name: Upload smoke-tests surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-tests-surefire-reports
          path: knife4j/knife4j-smoke-tests/*/target/surefire-reports/**
          if-no-files-found: ignore

  front-core-test:
    needs: changes
    if: needs.changes.outputs.react == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Test front core
        run: tools/test-front-core.sh

      - name: Verify Schema Worker in headless Chrome
        run: |
          mkdir -p build/reports/schema-worker
          bun front/ui-react/scripts/run-schema-example-worker-acceptance.mjs --smoke --static-root front/ui-react/dist > build/reports/schema-worker/acceptance.json

      - name: Upload Schema Worker browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-worker-browser
          path: build/reports/schema-worker/acceptance.json
          if-no-files-found: ignore
          retention-days: 14

  knife4x-go-test:
    needs: changes
    if: needs.changes.outputs.knife4x_go == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: core
            go-version: '1.22.x'
          - module: all
            go-version: '1.26.x'
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache: false

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Test Knife4x Go
        run: ./tools/test-knife4x-go.sh --module "${{ matrix.module }}"

      - name: Verify Knife4x Go UI assets
        if: matrix.module == 'all'
        run: ./tools/sync-knife4x-ui.sh --check

  vue3-test:
    needs: changes
    if: needs.changes.outputs.vue3 == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Test Vue3 UI
        run: tools/test-vue3.sh

  docs-build:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Build docs site
        run: tools/test-docs.sh
