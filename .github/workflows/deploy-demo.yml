name: Build and Deploy Demo

# Demo 只部署已经完成公开制品核验的正式版本。Release workflow 是正常入口；
# workflow_dispatch 只用于重新部署当前 latest release。
on:
  workflow_call:
    inputs:
      tag:
        description: "Published vX.Y.Z tag to deploy"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Current latest published vX.Y.Z tag to redeploy"
        required: true
        type: string

concurrency:
  group: deploy-demo-${{ inputs.tag }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RELEASE_ROOT: ${{ github.workspace }}/release-source
    steps:
      - name: Checkout current deployment tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Checkout exact release tag source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: release-source
          fetch-depth: 0

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_GITHUB_RELEASE_REQUIRE_LATEST: true
        run: |
          release_notes="$RUNNER_TEMP/github-release-notes.md"
          VERIFY_RELEASE_REPO_ROOT="$RELEASE_ROOT" \
            tools/verify-release-context.sh "$RELEASE_TAG" "$release_notes"
          VERIFY_MAVEN_REPO_ROOT="$RELEASE_ROOT" \
            tools/verify-maven-central.sh "${RELEASE_TAG#v}"
          tools/verify-github-release.sh "$RELEASE_TAG" "$release_notes"

  build-and-push:
    needs: verify-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # OpenAPI 3 (Spring Boot 3 + springdoc + React UI) — deployed to openapi3.demo.knife4jnext.com
          - module: knife4j-demo-openapi3
            image: knife4j-next-demo-openapi3
            context: knife4j/knife4j-demo-openapi3
          # OpenAPI 2 (Spring Boot 2 + springfox + Vue3 UI) — deployed to openapi2.demo.knife4jnext.com
          - module: knife4j-demo-openapi2
            image: knife4j-next-demo-openapi2
            context: knife4j/knife4j-demo-openapi2
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install front workspace dependencies
        run: bun install --frozen-lockfile
        working-directory: front

      - name: Install front/vue3 dependencies
        run: bun install --frozen-lockfile
        working-directory: front/vue3

      - name: Build jar
        working-directory: knife4j
        run: mvn -B -ntp -pl ${{ matrix.module }} -am package -DskipTests

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
